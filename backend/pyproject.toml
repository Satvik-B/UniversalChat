[tool.poetry]
name = "universalchat-backend"
version = "0.1.0"
description = "Backend for UniversalChat"
authors = ["Satvik Bansal <satvik.bansal2001@gmail.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.110"
uvicorn = "^0.29"
pydantic = "^2.7"
mem0ai = "^0.1.0"
google-cloud-firestore = "^2.16"
pyjwt = "^2.10.1"
google-api-python-client = "^2.181.0"
google-auth = "^2.40.3"
google-auth-oauthlib = "^1.2.2"
python-dotenv = "^1.1.1"

[tool.poetry.dev-dependencies]
pytest = "^8.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
